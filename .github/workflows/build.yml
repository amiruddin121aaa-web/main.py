name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install System Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            autoconf \
            automake \
            libtool \
            pkg-config \
            libffi-dev \
            zlib1g-dev \
            zip \
            unzip \
            cmake \
            build-essential

      - name: Install Python Tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade setuptools wheel packaging
          python -m pip install "Cython>=3.0.0"
          python -m pip install buildozer
          python -m pip install "python-for-android==2024.1.21"

      - name: Locate buildozer.spec and Build APK
        env:
          PATH: /opt/hostedtoolcache/Python/3.11.17/x64/bin:/opt/hostedtoolcache/Python/3.11.14/x64/bin:/opt/hostedtoolcache/Python/3.11.11/x64/bin:/opt/hostedtoolcache/Python/3.11.9/x64/bin:$PATH
          C_INCLUDE_PATH: ""
          CPLUS_INCLUDE_PATH: ""
        run: |
          find . -maxdepth 2 -iname "*buildozer*.spec" -exec cp {} ./buildozer.spec \;
          python -m buildozer -v android debug

      - name: Upload Final APK
        uses: actions/upload-artifact@v4
        with:
          name: calculator-apk
          path: bin/*.apk
