name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y autoconf automake libtool pkg-config libffi-dev zlib1g-dev zip unzip openjdk-17-jdk
          pip install --upgrade pip
          pip install --upgrade "cython<3.0.0" buildozer setuptools wheel packaging

      - name: Build APK
        run: |
          yes | buildozer -v android debug

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: calculator-apk
          path: bin/*.apk
